name: Daily Book Scraper & Cloud Sync

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch:      # Allows you to trigger it manually from GitHub anytime

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase websockets requests
          playwright install --with-deps chromium

      - name: Run Python Scraper Script
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pw.py