name: Daily Book Scraper & Cloud Sync

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch:      # Allows you to trigger it manually from GitHub anytime

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase websockets requests
          playwright install chromium

      - name: Run Python Scraper Script
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pw.py

      - name: Send Email Notification on Success/Failure
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Book Scraper Pipeline Status: ${{ job.status }}"
          body: "The book scraper workflow finished with status: ${{ job.status }}. Check your Retool dashboard for updated inventory."
          to: ${{ secrets.ALERT_RECIPIENT }}
          from: Book Scraper Bot <${{ secrets.EMAIL_USERNAME }}>
